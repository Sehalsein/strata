name: Strata
options:
  bundleIdPrefix: com.strata
  deploymentTarget:
    iOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    # Simulators: Apple silicon only.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    EXCLUDED_ARCHS[sdk=appletvsimulator*]: x86_64

packages:
  StrataKit:
    path: Packages/StrataKit
  StrataDesign:
    path: Packages/StrataDesign
  StrataPlayerUI:
    path: Packages/StrataPlayerUI
  StrataFeatures:
    path: Packages/StrataFeatures

targets:
  Strata:
    type: application
    supportedDestinations: [iOS, tvOS]
    sources:
      - App
      - path: Resources/Assets.xcassets
        buildPhase: resources
      # The iPhone and iPad icon, made in Icon Composer: the system renders its glass.
      - path: Resources/AppIcon.icon
        buildPhase: resources
        destinationFilters: [iOS]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Strata
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: StrataBackground
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSApplicationCategoryType: public.app-category.entertainment
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSBonjourServices: [_strata._tcp, _strata-tv._tcp]
        NSLocalNetworkUsageDescription: Strata looks for your Strata servers, and lets a phone sign in your Apple TV, on the local network.
        NSCameraUsageDescription: Strata uses the camera to scan sign-in and server QR codes from your server's dashboard.
        NSUserActivityTypes:
          - com.strata.viewing
          - com.strata.watching
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.sehalsein.strata
            CFBundleURLSchemes: [strata]
    dependencies:
      - package: StrataKit
        product: StrataKit
      - package: StrataDesign
        product: StrataDesign
      - package: StrataPlayerUI
        product: StrataPlayerUI
      - package: StrataFeatures
        product: StrataFeatures
      - target: StrataWidgets
        embed: true
        platformFilter: iOS
      # The Apple TV's Top Shelf: Continue Watching and Up Next.
      - target: StrataTopShelf
        embed: true
        destinationFilters: [tvOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sehalsein.strata
        "TARGETED_DEVICE_FAMILY[sdk=iphoneos*]": "1,2"
        "TARGETED_DEVICE_FAMILY[sdk=iphonesimulator*]": "1,2"
        "TARGETED_DEVICE_FAMILY[sdk=appletvos*]": "3"
        "TARGETED_DEVICE_FAMILY[sdk=appletvsimulator*]": "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletvos*]: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletvsimulator*]: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: App/Strata-iOS.entitlements
          CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: App/Strata-iOS.entitlements
          # The App Group the Top Shelf extension reads from.
          CODE_SIGN_ENTITLEMENTS[sdk=appletvos*]: App/Strata-tvOS.entitlements
          CODE_SIGN_ENTITLEMENTS[sdk=appletvsimulator*]: App/Strata-tvOS.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: App/Strata-iOS.entitlements
          CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: App/Strata-iOS.entitlements
          CODE_SIGN_ENTITLEMENTS[sdk=appletvos*]: App/Strata-tvOS.entitlements
          CODE_SIGN_ENTITLEMENTS[sdk=appletvsimulator*]: App/Strata-tvOS.entitlements
          "CODE_SIGN_STYLE[sdk=iphoneos*]": Manual
          "CODE_SIGN_STYLE[sdk=appletvos*]": Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          "CODE_SIGN_IDENTITY[sdk=appletvos*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": AppStore com.sehalsein.strata
          "PROVISIONING_PROFILE_SPECIFIER[sdk=appletvos*]": AppStore tvOS com.sehalsein.strata

  StrataTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - UITests
    dependencies:
      - target: Strata
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sehalsein.strata.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Strata

  StrataWidgets:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - StrataWidgets
    info:
      path: StrataWidgets/Info.plist
      properties:
        CFBundleDisplayName: Strata
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sehalsein.strata.widgets
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.10"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          "CODE_SIGN_STYLE[sdk=iphoneos*]": Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": AppStore com.sehalsein.strata.widgets

  StrataTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: StrataTopShelf
        excludes: ["*.entitlements"]
    dependencies:
      - package: StrataKit
        product: StrataKit
    info:
      path: StrataTopShelf/Info.plist
      properties:
        CFBundleDisplayName: Strata
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # App Store Connect rejects a 64-bit-only extension without this (ITMS-90502).
        UIRequiredDeviceCapabilities: [arm64]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ContentProvider"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sehalsein.strata.topshelf
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.10"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_ENTITLEMENTS: StrataTopShelf/StrataTopShelf.entitlements
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: AppStore tvOS com.sehalsein.strata.topshelf

schemes:
  Strata:
    build:
      targets:
        Strata: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StrataTVUITests
    archive:
      config: Release
