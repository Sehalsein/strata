name: Strata
options:
  bundleIdPrefix: com.strata
  deploymentTarget:
    iOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

packages:
  StrataKit:
    path: Packages/StrataKit
  StrataDesign:
    path: Packages/StrataDesign
  StrataPlayerUI:
    path: Packages/StrataPlayerUI
  StrataFeatures:
    path: Packages/StrataFeatures

targets:
  Strata:
    type: application
    supportedDestinations: [iOS, tvOS]
    sources:
      - App
      - path: Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Strata
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: StrataBackground
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSApplicationCategoryType: public.app-category.entertainment
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSBonjourServices: [_strata._tcp]
        NSLocalNetworkUsageDescription: Strata looks for your Strata servers on the local network.
        NSUserActivityTypes:
          - com.strata.viewing
          - com.strata.watching
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.sehalsein.strata
            CFBundleURLSchemes: [strata]
    dependencies:
      - package: StrataKit
        product: StrataKit
      - package: StrataDesign
        product: StrataDesign
      - package: StrataPlayerUI
        product: StrataPlayerUI
      - package: StrataFeatures
        product: StrataFeatures
      - target: StrataWidgets
        embed: true
        platformFilter: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sehalsein.strata
        "TARGETED_DEVICE_FAMILY[sdk=iphoneos*]": "1,2"
        "TARGETED_DEVICE_FAMILY[sdk=iphonesimulator*]": "1,2"
        "TARGETED_DEVICE_FAMILY[sdk=appletvos*]": "3"
        "TARGETED_DEVICE_FAMILY[sdk=appletvsimulator*]": "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletvos*]: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletvsimulator*]: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: App/Strata-iOS.entitlements
          CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: App/Strata-iOS.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: App/Strata-iOS.entitlements
          CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: App/Strata-iOS.entitlements
          "CODE_SIGN_STYLE[sdk=iphoneos*]": Manual
          "CODE_SIGN_STYLE[sdk=appletvos*]": Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          "CODE_SIGN_IDENTITY[sdk=appletvos*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": AppStore com.sehalsein.strata
          "PROVISIONING_PROFILE_SPECIFIER[sdk=appletvos*]": AppStore tvOS com.sehalsein.strata

  StrataTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - UITests
    dependencies:
      - target: Strata
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sehalsein.strata.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Strata

  StrataWidgets:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - StrataWidgets
    info:
      path: StrataWidgets/Info.plist
      properties:
        CFBundleDisplayName: Strata
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sehalsein.strata.widgets
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.10"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          "CODE_SIGN_STYLE[sdk=iphoneos*]": Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": AppStore com.sehalsein.strata.widgets

schemes:
  Strata:
    build:
      targets:
        Strata: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StrataTVUITests
    archive:
      config: Release
