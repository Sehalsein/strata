name: Server Deploy

# Deploys the cloud server (deploy/cloudflare: the Worker at strata.sehalsein.com and its
# dashboard) when Server CI passes on main, or by hand. The Worker's own secrets
# (DATABASE_URL, STRATA_SECRET_KEY, RESEND_API_KEY, …) live in Cloudflare and stay as they
# are; this only needs a token that may deploy Workers, kept in the `cloudflare`
# environment, which only `main` may deploy to.
on:
  workflow_run:
    workflows: [Server CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, the newest last; never cancel one halfway.
concurrency:
  group: server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare
      url: https://strata.sehalsein.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI passed on, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.20

      - name: Install
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd apps/server/web

      - name: Build the dashboard
        working-directory: apps/server/web
        run: bun run build

      - name: Deploy
        working-directory: deploy/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --message "${GITHUB_SHA::7} via GitHub Actions"
