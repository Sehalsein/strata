name: Server CI

# Typecheck, test and build-check the server and its dashboard on every change to them.
on:
  push:
    # main only: work branches are checked by their PR (a push there too ran everything twice).
    branches: [main]
    paths:
      - "apps/server/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "apps/server/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/server-ci.yml"

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.20

      - name: Install
        run: bun install --frozen-lockfile

      # The tests generate small media fixtures with ffmpeg and probe them with ffprobe. Without
      # both on PATH those tests skip themselves, so this step fails loudly if either is missing.
      # It's the pinned, checksummed build the server sets up for itself (src/platform/
      # ffmpegInstall.ts): seconds to fetch, where apt-get took 20 s and sometimes 10 minutes.
      - name: Install ffmpeg
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/ffmpeg"
          bun -e 'import { installFfmpeg } from "./apps/server/src/platform/ffmpegInstall.ts"; if (!(await installFfmpeg(process.argv[1]))) process.exit(1);' "$dir"
          echo "$dir/bin" >> "$GITHUB_PATH"
          "$dir/bin/ffmpeg" -hide_banner -version | head -1
          "$dir/bin/ffprobe" -hide_banner -version | head -1

      - name: Typecheck
        working-directory: apps/server
        run: bun run typecheck

      # Each file in its own Bun process: one process for the whole suite piles up dozens
      # of in-memory PGlite databases, and on this runner Bun then segfaults or PGlite
      # fails to start one.
      - name: Test
        working-directory: apps/server
        run: |
          set -uo pipefail
          files=$(find test src -name '*.test.ts' | sort) || exit 1
          # Finding no tests (a moved folder, say) fails, rather than passing on nothing.
          [ -n "$files" ] || { echo "::error::no test files found"; exit 1; }
          failed=0
          out=$(mktemp)
          for f in $files; do
            echo "::group::$f"
            if ! bun test "./$f" 2>&1 | tee "$out"; then
              # PGlite's WebAssembly sometimes crashes on these runners (never locally): the
              # database itself dies, not a test. That, and only that, gets one more try.
              if grep -qE "RuntimeError: (Aborted\(\)|Out of bounds memory access)" "$out"; then
                echo "::warning file=apps/server/$f::PGlite crashed; running the file again"
                bun test "./$f" || { failed=1; echo "::error file=apps/server/$f::tests failed"; }
              else
                failed=1; echo "::error file=apps/server/$f::tests failed"
              fi
            fi
            echo "::endgroup::"
          done
          echo "Ran $(wc -w <<< "$files") test files"
          exit $failed

  # The dashboard is embedded in every release binary: a broken build should fail here, not there.
  web:
    name: Dashboard and binary build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.20

      - name: Install
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd apps/server/web

      - name: Build the dashboard
        working-directory: apps/server/web
        run: bun run build

      - name: Build a Linux binary with the dashboard embedded
        working-directory: apps/server
        run: bun scripts/build.ts --target bun-linux-x64 --skip-web

  # Whether the code a first start's ffmpeg setup runs through changed: the download and
  # unpacking (src/platform), its wiring at start-up (services, jobs, main, profile), and the
  # build of the binary itself. Anything in doubt runs it.
  ffmpeg-changes:
    name: First-run code changed?
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Look for changes
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          run() { echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null || ! git cat-file -e "$HEAD^{commit}" 2>/dev/null; then
            run
          fi
          range="$BASE...$HEAD"
          [ "$EVENT" = push ] && range="$BASE..$HEAD"
          files="$RUNNER_TEMP/changed-files"
          git diff -z --name-only --no-renames "$range" > "$files" || run
          # Only grep's clean "no match" (1) skips: a match (0) or an error (2) runs it.
          match=0
          grep -qzE '^(apps/server/src/platform/|apps/server/src/(services|jobs|main|profile)\.ts$|apps/server/src/jobs/|apps/server/scripts/build\.ts$|apps/server/package\.json$|package\.json$|bun\.lock$|\.github/workflows/server-ci\.yml$)' "$files" || match=$?
          if [ "$match" -ne 1 ]; then
            run
          fi
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "No changes to the first-run ffmpeg setup: skipping that check."

  # A fresh install on a machine with no ffmpeg: the server sets up its own (pinned and
  # checksummed) on first start, and that ffmpeg works on this platform.
  first-run:
    name: First run sets up ffmpeg (${{ matrix.os }})
    needs: ffmpeg-changes
    if: needs.ffmpeg-changes.outputs.changed != 'false'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.20

      - name: Build
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun install --frozen-lockfile --ignore-scripts --cwd apps/server/web
          cd apps/server && bun scripts/build.ts
        shell: bash

      - name: Start with no ffmpeg on the machine
        shell: bash
        run: |
          set -euo pipefail
          for tool in ffmpeg ffprobe; do
            if path="$(command -v "$tool")"; then sudo rm -f "$path"; fi
          done
          ! command -v ffmpeg
          data="$RUNNER_TEMP/strata-data"
          bin="$(ls apps/server/dist/strata-server-*)"
          "$bin" --data-dir "$data" --port 18420 > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 120); do
            grep -q "Using ffmpeg" "$RUNNER_TEMP/server.log" && break
            grep -q "Job installFfmpeg failed" "$RUNNER_TEMP/server.log" && break
            sleep 2
          done
          cat "$RUNNER_TEMP/server.log"
          grep -q "Using ffmpeg" "$RUNNER_TEMP/server.log"
          curl -fsS http://127.0.0.1:18420/api/info
          echo "DATA=$data" >> "$GITHUB_ENV"

      - name: The installed ffmpeg works
        shell: bash
        run: |
          set -euo pipefail
          "$DATA/bin/ffmpeg" -hide_banner -version | head -1
          "$DATA/bin/ffmpeg" -hide_banner -encoders | grep -E "videotoolbox|vaapi|qsv" | head -5
          "$DATA/bin/ffmpeg" -hide_banner -loglevel error -f lavfi -i testsrc=duration=2:size=640x360:rate=24 \
            -f lavfi -i sine=duration=2 -c:v libx264 -c:a aac -shortest "$RUNNER_TEMP/clip.mp4"
          "$DATA/bin/ffprobe" -v error -show_entries stream=codec_name -of csv=p=0 "$RUNNER_TEMP/clip.mp4"
