name: Server CI

# Typecheck, test and build-check the server and its dashboard on every change to them.
on:
  push:
    branches: [main, strata-server]
    paths:
      - "apps/server/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "apps/server/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/server-ci.yml"

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.20

      # The tests generate small media fixtures with ffmpeg and probe them with ffprobe.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd apps/server/web

      - name: Typecheck
        working-directory: apps/server
        run: bun run typecheck

      - name: Test
        working-directory: apps/server
        run: bun test

      # The dashboard is embedded in every release binary: a broken build should fail here, not there.
      - name: Build the dashboard and a Linux binary
        working-directory: apps/server
        run: bun scripts/build.ts --target bun-linux-x64
