name: web-image

# Build the Strata web image and publish to private GHCR so the Mac mini
# home server can `docker compose pull && up -d` without a source checkout.
#
# Security note: this workflow never interpolates user-controlled event
# payloads (PR title, commit message, head_ref, ...) into `run:` blocks.
# All ${{ ... }} expressions reference trusted GitHub-managed fields
# (github.repository_owner, github.ref, github.actor) or are consumed by
# actions as typed inputs, not shell.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/web/**"
      - "bun.lock"
      - "package.json"
      - "tsconfig.base.json"
      - "turbo.json"
      - ".github/workflows/web-image.yml"
  workflow_dispatch: {}

concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          # arm64 emulation so we can cross-compile from the amd64 runner.
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Lowercased automatically; ${{ github.repository_owner }} is "Sehalsein"
          # so the image becomes ghcr.io/sehalsein/strata-web.
          images: ghcr.io/${{ github.repository_owner }}/strata-web
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_JELLYFIN_URL=/jf
          # GHA-hosted layer cache so day-to-day pushes only rebuild the
          # source layers, not the bun install.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
