name: Server Release

# Publishes signed strata-server builds as GitHub releases, which installed servers poll for
# updates (the repository is public, so release files download without a login).
#
# - **Nightly**, on every server change merged to main: version `<next patch>-nightly.<run>`,
#   in the rolling `server-nightly` prerelease. Versioned against the next patch so a nightly
#   always outranks the release it came after: 0.1.0 < 0.1.1-nightly.7 < 0.1.1.
# - **Stable**, when `apps/server/package.json` has a version with no `server-v<version>`
#   tag yet: a `server-v<version>` release with the binaries, and its signed manifest in the
#   rolling `server-stable` release. To ship one, bump that version and merge.
#
# Each binary is built with the feed `…/releases/download/server-{channel}` and its channel,
# so it reads `server-<channel>/manifest.json`. Manifests are signed with the key whose public
# half is in apps/server/src/update/publicKey.ts; servers refuse anything else.
#
# The signing key is an environment secret of `server-release`, which only `main` may deploy
# to, and signing only runs for publishing runs, so no other branch's code ever holds it.
on:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/server-release.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish (off = build only, unsigned)
        type: boolean
        default: false

permissions:
  contents: read

# Two merges in quick succession must not race each other; never cancel half a publish.
concurrency:
  group: server-release
  cancel-in-progress: false

jobs:
  channel:
    name: Channel
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.check.outputs.builds }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - id: check
        env:
          RUN_NUMBER: ${{ github.run_number }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          base="$(jq -r .version apps/server/package.json)"
          IFS=. read -r major minor patch <<< "$base"
          nightly="$major.$minor.$((patch + 1))-nightly.$RUN_NUMBER"

          builds='[]'
          add() {
            builds="$(jq -c --arg channel "$1" --arg version "$2" '. + [{channel: $channel, version: $version}]' <<< "$builds")"
            echo "::notice::$1 build, version $2"
          }
          # The tag records what has shipped, so it survives re-runs and empty merges.
          if ! git rev-parse -q --verify "refs/tags/server-v$base" >/dev/null; then
            add stable "$base"
          fi
          add nightly "$nightly"
          echo "builds=$builds" >> "$GITHUB_OUTPUT"

          # Only main publishes; a manual run publishes only when asked to.
          publish=true
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::notice::$REF is not main: building only"
            publish=false
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$PUBLISH_INPUT" != "true" ]; then
            echo "::notice::manual run without publish: building only"
            publish=false
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  release:
    name: ${{ matrix.channel }} ${{ matrix.version }}
    needs: channel
    # macOS: the darwin binary has to be ad-hoc signed with codesign; Linux ones cross-compile.
    runs-on: macos-15
    timeout-minutes: 30
    # Deployment branches: main only. Its secrets (the signing key) exist for nothing else.
    environment: server-release
    permissions:
      contents: write # releases and tags
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.channel.outputs.builds) }}
    env:
      CHANNEL: ${{ matrix.channel }}
      VERSION: ${{ matrix.version }}
      REPO: ${{ github.repository }}
      PUBLISH: ${{ needs.channel.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the token stays out of .git/config, away from build steps

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.20

      # No dependency lifecycle scripts: a release build runs only code from this repository.
      - name: Install
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun install --frozen-lockfile --ignore-scripts --cwd apps/server/web

      - name: Build
        working-directory: apps/server
        run: |
          bun scripts/build.ts --all --version "$VERSION" --channel "$CHANNEL" \
            --update-url "https://github.com/$REPO/releases/download/server-{channel}"
          reported="$(./dist/strata-server-darwin-arm64 --version)"
          case "$reported" in *"$VERSION"*) ;; *) echo "::error::built $reported, expected $VERSION"; exit 1 ;; esac
          # Versioned names (what manifests point at) plus checksums for checking a first install.
          cd dist
          for platform in darwin-arm64 linux-x64 linux-arm64; do
            cp "strata-server-$platform" "strata-server-$VERSION-$platform"
          done
          shasum -a 256 strata-server-darwin-arm64 strata-server-linux-x64 strata-server-linux-arm64 > SHA256SUMS
          cat SHA256SUMS

      - name: Sign the manifest
        if: env.PUBLISH == 'true'
        working-directory: apps/server
        env:
          STRATA_UPDATE_PRIVATE_KEY: ${{ secrets.STRATA_UPDATE_PRIVATE_KEY }}
        run: |
          # Stable binaries stay in their versioned release; nightly ones in the rolling one.
          if [ "$CHANNEL" = stable ]; then assets="server-v$VERSION"; else assets="server-nightly"; fi
          bun scripts/release-manifest.ts --version "$VERSION" --channel "$CHANNEL" --dir dist \
            --base-url "https://github.com/$REPO/releases/download/$assets" --out dist/feed

      # Strata.app for the Mac: Developer ID signed and notarized, so it opens like any app.
      # Skipped (with a warning) until the Developer ID certificate is set up.
      - name: Mac app
        id: macapp
        if: env.PUBLISH == 'true'
        working-directory: apps/server
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEVELOPER_ID_P12:-}" ]; then
            echo "::warning::No Developer ID certificate (DEVELOPER_ID_P12_BASE64): no Mac app this time"
            exit 0
          fi
          keychain="$RUNNER_TEMP/devid.keychain-db"
          kpass="$(uuidgen)"
          security create-keychain -p "$kpass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kpass" "$keychain"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$keychain" -P "$DEVELOPER_ID_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/devid.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kpass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')"
          [ -n "$identity" ] || { echo "::error::The certificate isn't a Developer ID Application identity"; exit 1; }

          STRATA_SIGN_IDENTITY="$identity" bun scripts/package-mac.ts --skip-build --version "$VERSION"

          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$key"
          xcrun notarytool submit "dist/Strata-$VERSION.dmg" --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
          rm -f "$key"
          xcrun stapler staple "dist/Strata-$VERSION.dmg"
          spctl --assess --type open --context context:primary-signature -v "dist/Strata-$VERSION.dmg"
          cp "dist/Strata-$VERSION.dmg" dist/Strata.dmg
          security delete-keychain "$keychain"
          echo "dmg=true" >> "$GITHUB_OUTPUT"

      # The only step that holds a write-capable token.
      - name: Publish
        if: env.PUBLISH == 'true'
        working-directory: apps/server/dist
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.macapp.outputs.dmg }}
        run: |
          set -euo pipefail
          feed="server-$CHANNEL"
          versioned=(strata-server-"$VERSION"-darwin-arm64 strata-server-"$VERSION"-linux-x64 strata-server-"$VERSION"-linux-arm64)
          fixed=(strata-server-darwin-arm64 strata-server-linux-x64 strata-server-linux-arm64 SHA256SUMS)
          if [ "$DMG" = true ]; then
            versioned+=("Strata-$VERSION.dmg")
            fixed+=(Strata.dmg)
            shasum -a 256 Strata.dmg >> SHA256SUMS
          fi

          if [ "$CHANNEL" = stable ]; then
            # The release people download from: versioned binaries and checksums.
            gh release create "server-v$VERSION" --repo "$REPO" --target "$GITHUB_SHA" --latest \
              --title "Strata Server $VERSION" \
              --notes "Strata Server $VERSION. Servers on the stable channel update to it on their own; see apps/server/README.md to install." \
              "${versioned[@]}" "${fixed[@]}"
          fi

          # The rolling feed release: created once, its files replaced on every publish.
          if ! gh release view "$feed" --repo "$REPO" >/dev/null 2>&1; then
            flags=(--latest=false)
            [ "$CHANNEL" = nightly ] && flags+=(--prerelease)
            gh release create "$feed" --repo "$REPO" --target "$GITHUB_SHA" "${flags[@]}" \
              --title "Strata Server ($CHANNEL feed)" \
              --notes "The $CHANNEL update feed that installed servers poll, and the current $CHANNEL binaries under fixed names."
          fi
          if [ "$CHANNEL" = nightly ]; then
            gh release upload "$feed" --repo "$REPO" --clobber "${versioned[@]}"
          fi
          gh release upload "$feed" --repo "$REPO" --clobber "${fixed[@]}"
          # The manifest last: published before the files it names, it would hand servers a 404.
          gh release upload "$feed" --repo "$REPO" --clobber feed/manifest.json.sig
          gh release upload "$feed" --repo "$REPO" --clobber feed/manifest.json

          # Older nightly binaries are no longer named by the manifest.
          if [ "$CHANNEL" = nightly ]; then
            gh release view "$feed" --repo "$REPO" --json assets --jq '.assets[].name' \
              | { grep -E '^(strata-server-[0-9].*-(darwin-arm64|linux-x64|linux-arm64)|Strata-[0-9].*\.dmg)$' || true; } \
              | { grep -v -F -- "-$VERSION-" || true; } \
              | while read -r old; do gh release delete-asset "$feed" "$old" --repo "$REPO" --yes; done
          fi
          echo "::notice::Published $CHANNEL $VERSION"

      - name: Keep the build (dry run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: strata-server-${{ matrix.channel }}
          retention-days: 5
          path: |
            apps/server/dist/strata-server-*
            apps/server/dist/SHA256SUMS
