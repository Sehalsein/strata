name: CodeQL

# Code scanning (CodeQL's advanced setup; GitHub's default setup must be off, or GitHub refuses
# these results). Weekly and on demand only, not on pull requests or merges: Swift alone needs a
# macOS runner and full Xcode builds of the app for iOS and tvOS, and those runners are better
# spent on the builds a merge waits for. Workflows, TypeScript and Ruby run alongside it.

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, ruby]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  swift:
    name: Analyze (swift)
    # Like apple-ci: the packages target macOS 26 and need Xcode 26.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/apple
        run: xcodegen generate

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      # Everything CodeQL should see is compiled while it watches: the app (with its packages
      # and widgets) for iOS and for tvOS, so code under `#if os(tvOS)` is analyzed too, and
      # the Mac launcher. arm64 only: the app excludes x86_64 for the simulators, so the x86_64
      # package builds a generic destination otherwise makes were the same source a second time.
      - name: Build the app
        working-directory: apps/apple
        run: |
          for platform in "iphonesimulator|iOS Simulator" "appletvsimulator|tvOS Simulator"; do
            xcodebuild build \
              -project Strata.xcodeproj -scheme Strata -configuration Debug \
              -sdk "${platform%%|*}" -destination "generic/platform=${platform#*|}" \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO COMPILER_INDEX_STORE_ENABLE=NO ARCHS=arm64
          done

      - name: Build the Mac launcher
        run: swiftc -swift-version 6 -target arm64-apple-macos14 apps/macos/StrataLauncher/main.swift -o "$RUNNER_TEMP/StrataLauncher"

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
