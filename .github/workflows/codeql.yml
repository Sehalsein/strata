name: CodeQL

# Code scanning (CodeQL's advanced setup; GitHub's default setup must be off, or GitHub refuses
# these results). Workflows, TypeScript and Ruby are quick and run on every change. Swift needs
# a macOS runner and full Xcode builds (about 20 minutes), so it runs only when the Apple apps
# (apps/apple) or the Mac launcher (apps/macos) change, and every week.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, ruby]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  changes:
    name: Swift changed?
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.diff.outputs.swift }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Look for Swift changes
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          analyze() { echo "swift=true" >> "$GITHUB_OUTPUT"; exit 0; }
          # The weekly scan and manual runs always analyze Swift, and so does anything in doubt:
          # a change we can't diff (a first push, a force push), or git failing.
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            analyze
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null || ! git cat-file -e "$HEAD^{commit}" 2>/dev/null; then
            analyze
          fi
          range="$BASE...$HEAD"
          [ "$EVENT" = push ] && range="$BASE..$HEAD"
          # NUL-separated paths, which git never quotes or escapes, and a moved file counts at
          # both its paths.
          files="$RUNNER_TEMP/changed-files"
          git diff -z --name-only --no-renames "$range" > "$files" || analyze
          # grep reads the NUL-separated list itself (no pipeline to break), and only its clean
          # "no match" (1) skips: a match (0) or an error (2) means analyze.
          match=0
          grep -qzE '^(apps/apple/|apps/macos/|\.github/workflows/codeql\.yml$)' "$files" || match=$?
          if [ "$match" -ne 1 ]; then
            analyze
          fi
          echo "swift=false" >> "$GITHUB_OUTPUT"
          echo "No changes to apps/apple or apps/macos: skipping the Swift analysis."

  swift:
    name: Analyze (swift)
    needs: changes
    if: needs.changes.outputs.swift != 'false'
    # Like apple-ci: Xcode 27 and its iOS and tvOS 27 SDKs.
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select Xcode 27
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/apple
        run: xcodegen generate

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      # Everything CodeQL should see is compiled while it watches: the app (with its packages
      # and widgets) for iOS and for tvOS, so code under `#if os(tvOS)` is analyzed too, and
      # the Mac launcher.
      - name: Build the app
        working-directory: apps/apple
        run: |
          for platform in "iphonesimulator|iOS Simulator" "appletvsimulator|tvOS Simulator"; do
            xcodebuild build \
              -project Strata.xcodeproj -scheme Strata -configuration Debug \
              -sdk "${platform%%|*}" -destination "generic/platform=${platform#*|}" \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO COMPILER_INDEX_STORE_ENABLE=NO
          done

      - name: Build the Mac launcher
        run: swiftc -swift-version 6 -target arm64-apple-macos14 apps/macos/StrataLauncher/main.swift -o "$RUNNER_TEMP/StrataLauncher"

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
