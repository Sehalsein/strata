name: Apple CI

on:
  # Every PR: "iOS and iPadOS", "tvOS" and "Swift packages" are required checks, so they report
  # on each one. A PR that doesn't touch the Apple apps gets them in seconds, skipped on a Linux
  # runner (see `changes`); one that does builds for real. No push runs: main only takes PRs
  # that are up to date with it (the "Protect main" ruleset), so a merge would build again
  # exactly what its PR already built.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Apple changed?
    runs-on: ubuntu-latest
    outputs:
      apple: ${{ steps.diff.outputs.apple }}
    steps:
      - name: Check out repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Look for Apple changes
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          build() { echo "apple=true" >> "$GITHUB_OUTPUT"; exit 0; }
          # Manual runs always build, and so does anything in doubt: a missing commit, or git
          # failing.
          if [ "$EVENT" != pull_request ]; then
            build
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null || ! git cat-file -e "$HEAD^{commit}" 2>/dev/null; then
            build
          fi
          # NUL-separated paths, which git never quotes or escapes, and a moved file counts at
          # both its paths.
          files="$RUNNER_TEMP/changed-files"
          git diff -z --name-only --no-renames "$BASE...$HEAD" > "$files" || build
          # grep reads the NUL-separated list itself (no pipeline to break), and only its clean
          # "no match" (1) skips: a match (0) or an error (2) means build.
          match=0
          grep -qzE '^(apps/apple/|\.github/workflows/apple-[^/]*\.yml$)' "$files" || match=$?
          if [ "$match" -ne 1 ]; then
            build
          fi
          echo "apple=false" >> "$GITHUB_OUTPUT"
          echo "No changes to apps/apple: the iOS and tvOS builds are skipped."

  build:
    # Always runs, so each check reports under its own name: a job skipped whole reports as
    # "${{ matrix.name }}", which wouldn't satisfy the required checks. Without Apple changes,
    # every step is skipped on a Linux runner. Only an explicit "false" skips: anything else builds.
    name: ${{ matrix.name }}
    needs: changes
    # Xcode 27 (macOS 27, GitHub's `xcode-27` image): the apps build against the iOS and tvOS
    # 27 SDKs, and the packages' SwiftUI tests run on the host. The package tests are a job of
    # their own, so they run alongside the two app builds.
    runs-on: ${{ needs.changes.outputs.apple == 'false' && 'ubuntu-latest' || 'xcode-27' }}
    env:
      APPLE_CHANGED: ${{ needs.changes.outputs.apple }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS and iPadOS
            id: ios
            sdk: iphonesimulator
            destination: generic/platform=iOS Simulator
          - name: tvOS
            id: tvos
            sdk: appletvsimulator
            destination: generic/platform=tvOS Simulator
          - name: Swift packages
            id: packages

    steps:
      - name: Check out repository
        if: env.APPLE_CHANGED != 'false'
        uses: actions/checkout@v7

      - name: Select Xcode 27
        if: env.APPLE_CHANGED != 'false'
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        if: env.APPLE_CHANGED != 'false' && matrix.id != 'packages'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: env.APPLE_CHANGED != 'false' && matrix.id != 'packages'
        working-directory: apps/apple
        run: xcodegen generate

      # Package downloads (AetherEngine, FFmpegBuild, …) survive between runs: SwiftPM's shared
      # repository cache for `swift test`, and Xcode's cloned packages for the app build. Both
      # still fetch from the remote and resolve as usual; the cache only saves re-cloning.
      - name: Restore Swift package downloads
        if: env.APPLE_CHANGED != 'false'
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            apps/apple/.build/DerivedData/SourcePackages
          key: apple-spm-${{ matrix.id }}-${{ hashFiles('apps/apple/project.yml', 'apps/apple/Packages/*/Package.swift') }}
          restore-keys: apple-spm-${{ matrix.id }}-

      - name: Run Swift package tests
        if: env.APPLE_CHANGED != 'false' && matrix.id == 'packages'
        working-directory: apps/apple
        run: |
          swift test --package-path Packages/StrataKit
          swift test --package-path Packages/StrataDesign
          swift test --package-path Packages/StrataPlayerUI

      - name: Build ${{ matrix.name }}
        if: env.APPLE_CHANGED != 'false' && matrix.id != 'packages'
        uses: Apple-Actions/xcodebuild@v1
        with:
          working-directory: apps/apple
          project: Strata.xcodeproj
          scheme: Strata
          configuration: Debug
          sdk: ${{ matrix.sdk }}
          destination: ${{ matrix.destination }}
          # arm64 only: the app already excludes x86_64 for the simulators (project.yml), but a
          # generic destination still built every Swift package for x86_64 too, which nothing used.
          build-settings: |
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            ARCHS=arm64
          disable-automatic-package-resolution: false

      - name: Upload build log
        if: env.APPLE_CHANGED != 'false' && matrix.id != 'packages' && (failure() || cancelled())
        uses: actions/upload-artifact@v7
        with:
          name: apple-${{ matrix.id }}-logs
          include-hidden-files: true
          if-no-files-found: warn
          path: apps/apple/.build/*.log
