name: Apple CI

on:
  # Every PR: "iOS and iPadOS" and "tvOS" are required checks, so they report on each one. A PR
  # that doesn't touch the Apple apps gets them in seconds, skipped on a Linux runner (see
  # `changes`); one that does builds for real.
  pull_request:
  push:
    # main, and the branches work happens on (a push there checks it before any PR exists).
    branches:
      - main
      - strata-server
      - "fix/**"
      - "feat/**"
      - "codex/**"
      - "test/**"
    paths:
      - "apps/apple/**"
      - ".github/workflows/apple-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Apple changed?
    runs-on: ubuntu-latest
    outputs:
      apple: ${{ steps.diff.outputs.apple }}
    steps:
      - name: Check out repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Look for Apple changes
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          build() { echo "apple=true" >> "$GITHUB_OUTPUT"; exit 0; }
          # Pushes and manual runs are already filtered to the Apple apps (see `on`). Anything
          # in doubt builds: a missing commit, or git failing.
          if [ "$EVENT" != pull_request ]; then
            build
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null || ! git cat-file -e "$HEAD^{commit}" 2>/dev/null; then
            build
          fi
          # NUL-separated paths, which git never quotes or escapes, and a moved file counts at
          # both its paths.
          files="$RUNNER_TEMP/changed-files"
          git diff -z --name-only --no-renames "$BASE...$HEAD" > "$files" || build
          # grep reads the NUL-separated list itself (no pipeline to break), and only its clean
          # "no match" (1) skips: a match (0) or an error (2) means build.
          match=0
          grep -qzE '^(apps/apple/|\.github/workflows/apple-[^/]*\.yml$)' "$files" || match=$?
          if [ "$match" -ne 1 ]; then
            build
          fi
          echo "apple=false" >> "$GITHUB_OUTPUT"
          echo "No changes to apps/apple: the iOS and tvOS builds are skipped."

  build:
    # Always runs, so each check reports under its own name: a job skipped whole reports as
    # "${{ matrix.name }}", which wouldn't satisfy the required checks. Without Apple changes,
    # every step is skipped on a Linux runner. Only an explicit "false" skips: anything else builds.
    name: ${{ matrix.name }}
    needs: changes
    # macOS 26: the packages target macOS 26, and their SwiftUI tests run on the host.
    runs-on: ${{ needs.changes.outputs.apple == 'false' && 'ubuntu-latest' || 'macos-26' }}
    env:
      APPLE_CHANGED: ${{ needs.changes.outputs.apple }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS and iPadOS
            id: ios
            sdk: iphonesimulator
            destination: generic/platform=iOS Simulator
          - name: tvOS
            id: tvos
            sdk: appletvsimulator
            destination: generic/platform=tvOS Simulator

    steps:
      - name: Check out repository
        if: env.APPLE_CHANGED != 'false'
        uses: actions/checkout@v7

      - name: Select Xcode 26
        if: env.APPLE_CHANGED != 'false'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        if: env.APPLE_CHANGED != 'false'
        run: brew install xcodegen

      - name: Restore FFmpeg
        if: env.APPLE_CHANGED != 'false'
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: apps/apple/Packages/StrataRemux/Frameworks
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('apps/apple/Packages/StrataRemux/scripts/build-ffmpeg.sh') }}

      # StrataRemux links FFmpeg (LGPL, built from source); the framework isn't kept in git.
      - name: Build FFmpeg
        if: env.APPLE_CHANGED != 'false' && (steps.ffmpeg-cache.outputs.cache-hit != 'true')
        working-directory: apps/apple
        run: Packages/StrataRemux/scripts/build-ffmpeg.sh

      - name: Generate Xcode project
        if: env.APPLE_CHANGED != 'false'
        working-directory: apps/apple
        run: xcodegen generate

      - name: Run Swift package tests
        if: env.APPLE_CHANGED != 'false' && (matrix.id == 'ios')
        working-directory: apps/apple
        run: |
          swift test --package-path Packages/StrataKit
          swift test --package-path Packages/StrataDesign
          swift test --package-path Packages/StrataRemux

      - name: Build ${{ matrix.name }}
        if: env.APPLE_CHANGED != 'false'
        uses: Apple-Actions/xcodebuild@v1
        with:
          working-directory: apps/apple
          project: Strata.xcodeproj
          scheme: Strata
          configuration: Debug
          sdk: ${{ matrix.sdk }}
          destination: ${{ matrix.destination }}
          build-settings: |
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
          disable-automatic-package-resolution: false

      - name: Upload build log
        if: env.APPLE_CHANGED != 'false' && (failure() || cancelled())
        uses: actions/upload-artifact@v7
        with:
          name: apple-${{ matrix.id }}-logs
          include-hidden-files: true
          if-no-files-found: warn
          path: apps/apple/.build/*.log
