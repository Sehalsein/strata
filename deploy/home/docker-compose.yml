# Strata on a home server (Linux, a NAS…), from the repo root:
#
#   docker compose -f deploy/home/docker-compose.yml up -d
#
# Then open http://<this machine>:8420. On first start the log prints a setup code
# (`docker compose -f deploy/home/docker-compose.yml logs strata`); the dashboard asks
# for it when you create the admin account.
services:
  strata:
    build:
      context: ../..
      dockerfile: deploy/home/Dockerfile
    container_name: strata
    restart: unless-stopped
    # Host networking lets the Apple apps find the server on the home network (Bonjour)
    # and join without a password. Linux only; on Docker Desktop (Mac/Windows) remove it
    # and keep `ports`, then add the server by its address in the apps.
    network_mode: host
    ports:
      - "8420:8420"
    volumes:
      # Everything the server keeps: the bundled database, the secret key that encrypts
      # API keys, logs and caches. Back this up.
      - strata-data:/data
      # Media folders, read-only. Add them in the dashboard as /media/movies etc.
      # - /path/to/movies:/media/movies:ro
      # - /path/to/shows:/media/shows:ro
    environment:
      TZ: UTC
      # Provider keys (TMDB, TorBox, OMDb) are each household's: set them in the
      # dashboard under Settings › Connections.
      # Optional: your own Postgres instead of the bundled database (e.g. the
      # `postgres` service below, or Neon). Uncomment both.
      # DATABASE_URL: postgres://strata:strata@localhost:5432/strata
#  postgres:
#    image: postgres:17
#    restart: unless-stopped
#    network_mode: host
#    environment:
#      POSTGRES_USER: strata
#      POSTGRES_PASSWORD: strata
#      POSTGRES_DB: strata
#    volumes:
#      - strata-postgres:/var/lib/postgresql/data

volumes:
  strata-data:
#  strata-postgres:
