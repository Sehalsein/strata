services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: strata-jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      # Local fallback (only used if /Volumes is empty)
      - ${MEDIA_PATH:-./media}:/media:ro
      # All macOS-mounted volumes: external drives, USB disks, and SMB/NFS
      # shares mounted via Finder → Connect to Server. Each shows up as
      # /Volumes/<name> on the host and inside the container.
      - /Volumes:/volumes:ro
      # The user's home media folders, in case media lives there.
      - ${HOME}/Movies:/host-movies:ro
    environment:
      - JELLYFIN_PublishedServerUrl=http://localhost:8096
