# Deploy / production compose. Pulls strata-web from GHCR and runs nginx.
# Use this on the Mac mini home server.
#
#   docker compose pull && docker compose up -d      # web app, registry image
#   docker compose --profile jellyfin up -d          # web + bundled Jellyfin
#
# To build and run the image from the local source tree (no registry pull),
# use the dev compose instead:
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Override the Jellyfin upstream via .env (`JELLYFIN_URL=`) or inline:
#
#   JELLYFIN_URL=http://jellyfin:8096 docker compose --profile jellyfin up -d

services:
  web:
    # Pulled from GHCR. Pin a SHA via IMAGE_TAG in .env to roll back. No
    # `build:` block here — source builds live in docker-compose.dev.yml.
    image: ghcr.io/sehalsein/strata-web:${IMAGE_TAG:-latest}
    container_name: strata-web
    restart: unless-stopped
    ports:
      # Host port (deliberately not "WEB_PORT" — that's Vite's dev port in .env).
      - "${STRATA_WEB_PORT:-8080}:80"
    environment:
      # Where nginx should forward /jf/* to. host.docker.internal hits the
      # host's Jellyfin install on Docker Desktop; on Linux the extra_hosts
      # mapping below makes it resolve to the host gateway.
      JELLYFIN_URL: ${JELLYFIN_URL:-http://host.docker.internal:8096}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Opt-in: run Jellyfin alongside the web app.
  #   docker compose --profile jellyfin up -d
  # Reuses your existing ./jellyfin/{config,cache} so library + users persist.
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: strata-jellyfin
    profiles: ["jellyfin"]
    restart: unless-stopped
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - ./media:/media:ro
    environment:
      JELLYFIN_PublishedServerUrl: ${JELLYFIN_PUBLISHED_URL:-http://localhost:8096}
